name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out released game
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Get the exact LÖVE Android 11.5 hotfix sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: love2d/love-android
          ref: 55feb38fa144f4734c26742389f279fb07d955c0
          path: android-build
          submodules: recursive
          persist-credentials: false

      - name: Qualify the native ICK source compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe

      - name: Package both qualified LuaJIT frame formats
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
          ICK_LINK_FLAGS: ${{ steps.ick.outputs.link_flags }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG_NAME='${{ github.event.release.tag_name }}'
          SAFE_TAG="${TAG_NAME//\//-}"
          make -f ick-luajit/Makefile package LOVE_ANDROID_SOURCE="$GITHUB_WORKSPACE/android-build" PACKAGE="$GITHUB_WORKSPACE/dist/game-${SAFE_TAG}.love"

      - name: Attach LÖVE game immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG_NAME='${{ github.event.release.tag_name }}'
          SAFE_TAG="${TAG_NAME//\//-}"
          gh release upload "$TAG_NAME" "dist/game-${SAFE_TAG}.love" --clobber

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build requirements
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;25.2.9519653'

      - name: Embed game
        shell: bash
        run: |
          set -euxo pipefail
          TAG_NAME='${{ github.event.release.tag_name }}'
          SAFE_TAG="${TAG_NAME//\//-}"

          mkdir -p android-build/app/src/embed/assets
          cp "dist/game-${SAFE_TAG}.love" android-build/app/src/embed/assets/game.love

          cd android-build
          sed -i '/^app.name_byte_array=/d' gradle.properties
          sed -i 's/^#app.name=.*/app.name=Game/' gradle.properties
          sed -i 's/^app.application_id=.*/app.application_id=org.isomorphisms.game.dev/' gradle.properties
          sed -i 's/^app.orientation=.*/app.orientation=landscape/' gradle.properties
          sed -i "s/^app.version_code=.*/app.version_code=${GITHUB_RUN_NUMBER}/" gradle.properties
          sed -i "s/^app.version_name=.*/app.version_name=${TAG_NAME}/" gradle.properties

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android-build
          ./gradlew assembleEmbedNoRecordRelease

      - name: Sign Android APK
        shell: bash
        run: |
          set -euxo pipefail
          TAG_NAME='${{ github.event.release.tag_name }}'
          SAFE_TAG="${TAG_NAME//\//-}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED='android-build/app/build/outputs/apk/embedNoRecord/release/app-embed-noRecord-release-unsigned.apk'

          base64 --decode .github/android-dev.keystore.b64 > /tmp/game-dev.keystore
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" /tmp/game-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/game-dev.keystore \
            --ks-key-alias game \
            --ks-pass pass:game-release-dev \
            --key-pass pass:game-release-dev \
            --out "dist/game-${SAFE_TAG}.apk" \
            /tmp/game-aligned.apk
          "$BUILD_TOOLS/apksigner" verify "dist/game-${SAFE_TAG}.apk"

      - name: Attach Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG_NAME='${{ github.event.release.tag_name }}'
          SAFE_TAG="${TAG_NAME//\//-}"
          gh release upload "$TAG_NAME" "dist/game-${SAFE_TAG}.apk" --clobber
